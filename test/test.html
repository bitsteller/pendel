<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test getData()</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 500;
        }
        input {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            background-color: #007AFF;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background-color: #0051D5;
        }
        button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }
        #result, #stationNamesResult, #trafficInfoResult, #scheduleResult {
            margin-top: 20px;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 4px;
            background-color: #f9f9f9;
            white-space: pre-wrap;
            font-family: monospace;
            font-size: 12px;
        }
        .error {
            color: #d32f2f;
        }
        .loading {
            color: #666;
        }
    </style>
</head>
<body>
    <h1>Test getData()</h1>
    
    <div class="form-group">
        <label for="from">From (Location Signature):</label>
        <input type="text" id="from" placeholder="e.g., Nr" value="Nr">
    </div>
    
    <div class="form-group">
        <label for="direction">Direction (Location Name):</label>
        <input type="text" id="direction" placeholder="e.g., Nk" value="Nk">
    </div>
    
    <button id="testBtn" onclick="testGetData()">Test getData()</button>
    
    <div id="result"></div>


    <hr style="margin: 30px 0; border: none; border-top: 1px solid #ddd;">
    
    <h2>Test getStationNames()</h2>
    
    <div class="form-group">
        <label for="locationSignatures">Location Signatures (comma-separated):</label>
        <input type="text" id="locationSignatures" placeholder="e.g., Nr, Nk, Cst" value="Nr, Nk, Cst">
    </div>
    
    <button id="testStationNamesBtn" onclick="testGetStationNames()">Test getStationNames()</button>
    
    <div id="stationNamesResult"></div>

    <hr style="margin: 30px 0; border: none; border-top: 1px solid #ddd;">

    <h2>Test getTrafficInfo()</h2>

    <div class="form-group">
        <label for="trafficLocation1">Location Signature 1:</label>
        <input type="text" id="trafficLocation1" placeholder="e.g., Nr" value="Nr">
    </div>

    <div class="form-group">
        <label for="trafficLocation2">Location Signature 2:</label>
        <input type="text" id="trafficLocation2" placeholder="e.g., Nk" value="Nk">
    </div>

    <button id="testTrafficInfoBtn" onclick="testGetTrafficInfo()">Test getTrafficInfo()</button>

    <div id="trafficInfoResult"></div>

    <hr style="margin: 30px 0; border: none; border-top: 1px solid #ddd;">

    <h2>Test schedule param &amp; route selection</h2>

    <div class="form-group">
        <label for="scheduleParam">Schedule parameter string:</label>
        <input type="text" id="scheduleParam" placeholder="e.g. Mån-Fre,7-9,Nr,Lp;Lör,6:30-9,Lp,Nr or Lp,Nr" value="Mån-Fre,7-9,Nr,Lp;Lör,6:30-9,Lp,Nr" style="font-family: monospace;">
    </div>

    <div class="form-group">
        <label for="scheduleDate">Optional date override (ISO string or leave empty for now):</label>
        <input type="text" id="scheduleDate" placeholder="e.g. 2025-03-11T08:00:00" value="">
    </div>

    <button id="testScheduleBtn" onclick="testScheduleParam()">Test parseScheduleParam</button>
    <button id="testActiveRouteBtn" onclick="testActiveRoute()">Test getActiveRoute</button>
    <button id="testNextRouteBtn" onclick="testNextRoute()">Test getNextRoute</button>

    <div id="scheduleResult"></div>

    <!-- Polyfill for Scriptable Request API -->
    <script>
        // Polyfill for Scriptable Request API to work in browser
        if (typeof Request === 'undefined' || !Request.prototype.loadString) {
            function BrowserRequest(url) {
                this.url = url
                this.method = 'GET'
                this.headers = new Headers()
                this.body = null
            }
            
            BrowserRequest.prototype.loadString = async function() {
                const response = await fetch(this.url, {
                    method: this.method,
                    headers: this.headers,
                    body: this.body
                })
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`)
                }
                
                return await response.text()
            }
            
            // Replace global Request with our polyfill
            window.Request = BrowserRequest
        }
    </script>

    <!-- Import lib.js -->
    <script src="lib.js"></script>

    <!-- Test function -->
    <script>

        async function testGetData() {
            const from = document.getElementById('from').value.trim()
            const direction = document.getElementById('direction').value.trim()
            const resultDiv = document.getElementById('result')
            const testBtn = document.getElementById('testBtn')
            
            if (!from || !direction) {
                resultDiv.innerHTML = '<span class="error">Please enter both From and Direction values.</span>'
                return
            }
            
            testBtn.disabled = true
            resultDiv.innerHTML = '<span class="loading">Loading...</span>'
            
            try {
                const data = await getData(from, direction, true)
                resultDiv.innerHTML = '<strong>Success!</strong>\n\n' + JSON.stringify(data, null, 2)
            } catch (error) {
                resultDiv.innerHTML = '<span class="error"><strong>Error:</strong> ' + error.message + '</span>'
                console.error('Error:', error)
            } finally {
                testBtn.disabled = false
            }
        }

        async function testGetStationNames() {
            const locationSignaturesInput = document.getElementById('locationSignatures').value.trim()
            const resultDiv = document.getElementById('stationNamesResult')
            const testBtn = document.getElementById('testStationNamesBtn')
            
            if (!locationSignaturesInput) {
                resultDiv.innerHTML = '<span class="error">Please enter location signatures.</span>'
                return
            }
            
            // Parse comma-separated location signatures
            const locationSignatures = locationSignaturesInput.split(',').map(sig => sig.trim()).filter(sig => sig.length > 0)
            
            if (locationSignatures.length === 0) {
                resultDiv.innerHTML = '<span class="error">Please enter at least one location signature.</span>'
                return
            }
            
            testBtn.disabled = true
            resultDiv.innerHTML = '<span class="loading">Loading...</span>'
            
            try {
                const data = await getStationNames(locationSignatures)
                resultDiv.innerHTML = '<strong>Success!</strong>\n\n' + JSON.stringify(data, null, 2)
            } catch (error) {
                resultDiv.innerHTML = '<span class="error"><strong>Error:</strong> ' + error.message + '</span>'
                console.error('Error:', error)
            } finally {
                testBtn.disabled = false
            }
        }

        async function testGetTrafficInfo() {
            const loc1 = document.getElementById('trafficLocation1').value.trim()
            const loc2 = document.getElementById('trafficLocation2').value.trim()
            const resultDiv = document.getElementById('trafficInfoResult')
            const testBtn = document.getElementById('testTrafficInfoBtn')

            if (!loc1 || !loc2) {
                resultDiv.innerHTML = '<span class="error">Please enter both location signatures.</span>'
                return
            }

            testBtn.disabled = true
            resultDiv.innerHTML = '<span class="loading">Loading...</span>'

            try {
                const data = await getTrafficInfo(loc1, loc2)
                resultDiv.innerHTML = '<strong>Success!</strong>\n\n' + JSON.stringify(data, null, 2)
            } catch (error) {
                resultDiv.innerHTML = '<span class="error"><strong>Error:</strong> ' + error.message + '</span>'
                console.error('Error:', error)
            } finally {
                testBtn.disabled = false
            }
        }

        function getScheduleDate() {
            const raw = document.getElementById('scheduleDate').value.trim()
            if (!raw) return null
            const d = new Date(raw)
            return isNaN(d.getTime()) ? null : d
        }

        function testScheduleParam() {
            const param = document.getElementById('scheduleParam').value.trim()
            const resultDiv = document.getElementById('scheduleResult')
            const testBtn = document.getElementById('testScheduleBtn')
            testBtn.disabled = true
            resultDiv.innerHTML = '<span class="loading">Running...</span>'
            try {
                const routes = parseScheduleParam(param)
                resultDiv.innerHTML = '<strong>parseScheduleParam result:</strong>\n\n' + (routes === null ? 'null' : JSON.stringify(routes, null, 2))
            } catch (error) {
                resultDiv.innerHTML = '<span class="error"><strong>Error:</strong> ' + error.message + '</span>'
                console.error('Error:', error)
            } finally {
                testBtn.disabled = false
            }
        }

        function testActiveRoute() {
            const param = document.getElementById('scheduleParam').value.trim()
            const resultDiv = document.getElementById('scheduleResult')
            const testBtn = document.getElementById('testActiveRouteBtn')
            const date = getScheduleDate()
            testBtn.disabled = true
            resultDiv.innerHTML = '<span class="loading">Running...</span>'
            try {
                const routes = parseScheduleParam(param)
                if (routes === null) {
                    resultDiv.innerHTML = '<span class="error">No routes (param has no semicolon or invalid). Use a schedule string like Mån-Fre,7-9,Nr,Lp;Lör,6:30-9,Lp,Nr</span>'
                    return
                }
                const active = getActiveRoute(routes, date)
                const usedDate = date || new Date()
                resultDiv.innerHTML = '<strong>getActiveRoute result</strong> (date: ' + usedDate.toISOString() + '):\n\n' + (active === null ? 'null' : JSON.stringify(active, null, 2))
            } catch (error) {
                resultDiv.innerHTML = '<span class="error"><strong>Error:</strong> ' + error.message + '</span>'
                console.error('Error:', error)
            } finally {
                testBtn.disabled = false
            }
        }

        function testNextRoute() {
            const param = document.getElementById('scheduleParam').value.trim()
            const resultDiv = document.getElementById('scheduleResult')
            const testBtn = document.getElementById('testNextRouteBtn')
            const date = getScheduleDate()
            testBtn.disabled = true
            resultDiv.innerHTML = '<span class="loading">Running...</span>'
            try {
                const routes = parseScheduleParam(param)
                if (routes === null) {
                    resultDiv.innerHTML = '<span class="error">No routes (param has no semicolon or invalid). Use a schedule string.</span>'
                    return
                }
                const next = getNextRoute(routes, date)
                const usedDate = date || new Date()
                resultDiv.innerHTML = '<strong>getNextRoute result</strong> (date: ' + usedDate.toISOString() + '):\n\n' + (next === null ? 'null' : JSON.stringify({ route: next.route, activeAt: next.activeAt.toISOString() }, null, 2))
            } catch (error) {
                resultDiv.innerHTML = '<span class="error"><strong>Error:</strong> ' + error.message + '</span>'
                console.error('Error:', error)
            } finally {
                testBtn.disabled = false
            }
        }
    </script>
</body>
</html>
